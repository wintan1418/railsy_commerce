running_sale:
  name: Weekend Mega Sale
  slug: weekend-mega-sale
  description: 48 hours of deep discounts
  starts_at: <%= 1.hour.ago.iso8601 %>
  ends_at: <%= 2.days.from_now.iso8601 %>
  discount_percentage: 30
  active: true

upcoming_sale:
  name: Next Week Sale
  slug: next-week-sale
  starts_at: <%= 3.days.from_now.iso8601 %>
  ends_at: <%= 5.days.from_now.iso8601 %>
  discount_percentage: 20
  active: true

ended_sale:
  name: Old Sale
  slug: old-sale
  starts_at: <%= 10.days.ago.iso8601 %>
  ends_at: <%= 5.days.ago.iso8601 %>
  discount_percentage: 40
  active: true

disabled_sale:
  name: Disabled Sale
  slug: disabled-sale
  starts_at: <%= 1.hour.ago.iso8601 %>
  ends_at: <%= 1.day.from_now.iso8601 %>
  discount_percentage: 50
  active: false
